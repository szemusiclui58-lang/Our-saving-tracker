<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家庭專屬儲蓄追蹤與雲端同步</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase App & Firestore SDKs (v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 公用 Firebase 展示用配置 (使用開源免費 Cloud Firestore 實例)
    const firebaseConfig = {
      apiKey: "AIzaSyD-PlaceholderForDemoConfigOnly",
      authDomain: "savings-tracker-demo.firebaseapp.com",
      projectId: "savings-tracker-demo",
      storageBucket: "savings-tracker-demo.appspot.com",
      messagingSenderId: "123456789012",
      appId: "1:123456789012:web:abcdef123456"
    };

    // 初始化 Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.doc = doc;
    window.setDoc = setDoc;
    window.onSnapshot = onSnapshot;
  </script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-emerald-600 text-white shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold flex items-center gap-2">
          <i class="fa-solid fa-piggy-bank"></i> 家庭專屬儲蓄追蹤器
        </h1>
        <p class="text-emerald-100 text-sm mt-1">預計每月 $30,000 儲蓄目標 $\cdot$ 夫妻/情侶即時同步</p>
      </div>
      
      <!-- Room Code / Share Section -->
      <div class="bg-emerald-700/80 p-3 rounded-xl border border-emerald-500/50 flex flex-wrap items-center gap-2 text-sm w-full md:w-auto">
        <span class="text-emerald-200">家庭同步房間:</span>
        <input type="text" id="roomIdInput" class="bg-emerald-800 text-white font-mono px-3 py-1 rounded border border-emerald-500 w-28 text-center uppercase font-bold focus:outline-none focus:ring-2 focus:ring-white" value="HOME2026">
        <button onclick="joinRoom()" class="bg-white text-emerald-700 font-semibold px-3 py-1 rounded hover:bg-emerald-50 transition text-xs shadow">
          連線/切換
        </button>
        <button onclick="copyShareLink()" class="bg-emerald-500 text-white font-semibold px-3 py-1 rounded hover:bg-emerald-400 transition text-xs flex items-center gap-1 shadow">
          <i class="fa-solid fa-share-nodes"></i> 複製連結
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto px-4 mt-6 grid grid-cols-1 md:grid-cols-3 gap-6">

    <!-- Left Column: Controls & Input -->
    <div class="space-y-6">
      
      <!-- Status Card -->
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="syncStatus">雲端同步中</span>
          </span>
          <span class="text-xs text-slate-400 font-mono" id="currentRoomDisplay">房間: HOME2026</span>
        </div>
        <div class="text-slate-500 text-xs">起始日期</div>
        <input type="month" id="startMonth" class="mt-1 w-full p-2 border rounded-lg text-sm bg-slate-50 border-slate-200
